<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFA500" />
    <meta
      name="description"
      content="Nuggets - Your family's finances, shared"
    />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS/iPadOS: "Add to Home Screen" uses these instead of the manifest icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nuggets" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Nuggets</title>
    <style>
      /* Prevent flash of unstyled content while CSS loads */
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
      }

      /* Dark mode detection */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #111827;
          color: #ffffff;
        }
      }

      /* The appearance the user chose (ThemeContext sets it on <html>) wins over the system's */
      html.dark body {
        background-color: #111827;
        color: #ffffff;
      }
      html.light body {
        background-color: #ffffff;
        color: inherit;
      }

      #root {
        min-height: 100vh;
      }

      /*
       * The notice for a browser older than the app's build target, in place of the app.
       * public/browser-support.js puts nuggets-unsupported on <html> when it is one. No
       * colours of its own: it takes the page's, light or dark. The build minifies this
       * style for the build target, so keep to CSS an old browser reads (no inset, logical
       * properties or nesting, which it could write for these), and look at build/index.html.
       */
      #unsupported-browser {
        display: none;
      }
      html.nuggets-unsupported #root {
        display: none;
      }
      html.nuggets-unsupported #unsupported-browser {
        display: block;
        max-width: 36rem;
        margin: 15vh auto 0;
        padding: 0 1rem;
        font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
      }
      #unsupported-browser h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: bold;
        line-height: 1.25;
      }
      #unsupported-browser p {
        margin: 0 0 1rem;
      }
      #unsupported-browser button {
        padding: 0.5rem 1rem;
        border: 1px solid currentColor;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <!-- Shows the notice below in a browser too old for the app: a classic ES5 script, before the app's module -->
    <script defer src="/browser-support.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <section id="unsupported-browser" aria-labelledby="unsupported-browser-title">
      <h1 id="unsupported-browser-title">Nuggets needs a newer browser</h1>
      <p>
        Nuggets works in Chrome or Edge 111, Firefox 128 and Safari 16.4, and in any later
        version. On an iPhone or iPad, every browser needs iOS or iPadOS 16.4 or later. This
        browser is older, so pages would look wrong or not work. Update it, or open Nuggets in
        one of those.
      </p>
      <p><button type="button" id="unsupported-browser-continue">Continue anyway</button></p>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
