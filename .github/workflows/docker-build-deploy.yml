name: Build and Deploy to GitHub Container Registry

on:
  # Manual trigger only - save GitHub Actions minutes
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  # Automatic trigger on version tags only (e.g., v1.2.3): pushes 1.2.3, 1.2, latest and
  # sha-<commit>, then the release job publishes the GitHub Release. This is the only
  # workflow that builds release images. cut-release.yml creates the tag and then starts
  # this workflow by workflow_dispatch on it (a tag pushed with GITHUB_TOKEN starts nothing):
  # with the tag as github.ref, the version tags, latest and the release job apply as they
  # do for a pushed tag.
  push:
    tags: [ 'v*' ]

# Every job states the access it needs; a job that states none gets none.
permissions: {}

# The images are ghcr.io/<repository owner, lowercased>/nuggets-{backend,frontend,postgres}:
# each job sets IMAGE_PREFIX before it logs in, so a fork or a transferred repository
# pushes to its own namespace.
#
# Tags each image gets (docker/metadata-action):
#   v1.2.3 tag     1.2.3, 1.2, latest, sha-<commit>  (a pre-release v1.3.0-rc.1: 1.3.0-rc.1
#                  and sha-<commit> only)
#   manual run     the branch (main) and sha-<commit>; latest moves only with a release tag
# sha-<commit> names that commit's build, so any build can be deployed again.
env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout
      packages: write   # push the image and its build cache
    outputs:
      # The image version on a release tag (1.2.3 for v1.2.3), for the release job.
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Image name prefix
      run: echo "IMAGE_PREFIX=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Backend
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.IMAGE_PREFIX }}/nuggets-backend
        # latest comes from flavor latest=auto: release tags (not pre-releases) only.
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push Backend Docker image
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        # Context is the repo root: Dockerfile.prod builds the npm workspace there (shared,
        # mcp and the backend, from the root package-lock.json).
        context: .
        file: ./backend/Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        # What the backend reports as its version (/api/health, log lines, backup
        # manifests): 1.2.3 on a release tag, the branch on a manual run.
        build-args: |
          APP_VERSION=${{ steps.meta.outputs.version }}
          GIT_SHA=${{ github.sha }}
        # Attestations stored with the image: what it contains and how it was built.
        sbom: true
        provenance: mode=max
        # Multi-layer caching strategy for maximum speed
        cache-from: |
          type=gha,scope=backend
          type=registry,ref=${{ env.IMAGE_PREFIX }}/nuggets-backend:buildcache
        cache-to: |
          type=gha,mode=max,scope=backend
          type=registry,ref=${{ env.IMAGE_PREFIX }}/nuggets-backend:buildcache,mode=max

    - name: Summary
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        {
          echo "### nuggets-backend"
          echo "Digest \`$DIGEST\`, tags:"
          while read -r tag; do echo "- \`$tag\`"; done <<<"$TAGS"
        } >> "$GITHUB_STEP_SUMMARY"

  # Postgres image with the baseline schema (backend/init.sql) baked into
  # /docker-entrypoint-initdb.d/ — so fresh deploys initialize with no bind mount.
  build-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout
      packages: write   # push the image and its build cache
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Image name prefix
      run: echo "IMAGE_PREFIX=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Postgres
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.IMAGE_PREFIX }}/nuggets-postgres
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push Postgres Docker image
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        # Context is repo root so the Dockerfile can COPY backend/init.sql.
        context: .
        file: ./Dockerfile.postgres
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        sbom: true
        provenance: mode=max
        cache-from: |
          type=gha,scope=postgres
          type=registry,ref=${{ env.IMAGE_PREFIX }}/nuggets-postgres:buildcache
        cache-to: |
          type=gha,mode=max,scope=postgres
          type=registry,ref=${{ env.IMAGE_PREFIX }}/nuggets-postgres:buildcache,mode=max

    - name: Summary
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        {
          echo "### nuggets-postgres"
          echo "Digest \`$DIGEST\`, tags:"
          while read -r tag; do echo "- \`$tag\`"; done <<<"$TAGS"
        } >> "$GITHUB_STEP_SUMMARY"

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout
      packages: write   # push the image and its build cache
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Image name prefix
      run: echo "IMAGE_PREFIX=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Frontend
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ env.IMAGE_PREFIX }}/nuggets-frontend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push Frontend Docker image
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        sbom: true
        provenance: mode=max
        # No build-time domain variables needed - runtime detection used
        # Multi-layer caching strategy for maximum speed
        cache-from: |
          type=gha,scope=frontend
          type=registry,ref=${{ env.IMAGE_PREFIX }}/nuggets-frontend:buildcache
        cache-to: |
          type=gha,mode=max,scope=frontend
          type=registry,ref=${{ env.IMAGE_PREFIX }}/nuggets-frontend:buildcache,mode=max

    - name: Summary
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        {
          echo "### nuggets-frontend"
          echo "Digest \`$DIGEST\`, tags:"
          while read -r tag; do echo "- \`$tag\`"; done <<<"$TAGS"
        } >> "$GITHUB_STEP_SUMMARY"

  # Read-only: it pulls the images this run pushed and scans them. Trivy runs in a job
  # that can't push images or edit releases, and needs no checkout.
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-postgres]
    permissions:
      packages: read    # pull the images while they are private

    steps:
    - name: Image name prefix
      run: echo "IMAGE_PREFIX=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

    - name: Log in to Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Scans the images this run pushed, by digest: a pre-release tag doesn't move latest.
    - name: Run Trivy vulnerability scanner for Backend
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: '${{ env.IMAGE_PREFIX }}/nuggets-backend@${{ needs.build-backend.outputs.digest }}'
        format: 'sarif'
        output: 'backend-trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Run Trivy vulnerability scanner for Frontend
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: '${{ env.IMAGE_PREFIX }}/nuggets-frontend@${{ needs.build-frontend.outputs.digest }}'
        format: 'sarif'
        output: 'frontend-trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    # Also generate human-readable reports for easier review
    - name: Run Trivy vulnerability scanner for Backend (table format)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: '${{ env.IMAGE_PREFIX }}/nuggets-backend@${{ needs.build-backend.outputs.digest }}'
        format: 'table'
        output: 'backend-trivy-report.txt'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Run Trivy vulnerability scanner for Frontend (table format)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: '${{ env.IMAGE_PREFIX }}/nuggets-frontend@${{ needs.build-frontend.outputs.digest }}'
        format: 'table'
        output: 'frontend-trivy-report.txt'
        severity: 'CRITICAL,HIGH,MEDIUM'

    # Note: the results aren't uploaded to GitHub code scanning (the Security tab), which a
    # private repository can use only with GitHub Advanced Security. Trivy still scans on
    # every build; results are in the job log and the artifact below (the SARIF files are
    # kept too, for an upload by hand).

    # Save all security scan results as artifacts
    - name: Upload security scan results as artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: trivy-security-reports
        path: |
          backend-trivy-results.sarif
          frontend-trivy-results.sarif
          backend-trivy-report.txt
          frontend-trivy-report.txt
        retention-days: 30

  # A release tag publishes a GitHub Release once its three images are pushed, with the
  # deployment manifest attached: docker-compose.portainer.yml with the Nuggets images
  # defaulting to this release, from this repository owner's registry, instead of latest.
  release:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-postgres]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # create the Release and attach the manifest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # The tags, to find the release before this one for its list of pull requests.
        fetch-depth: 0
        fetch-tags: true

    # The description's "What changed": this release's section of CHANGELOG.md, then the pull
    # requests merged since the release before it, as GitHub lists them
    # (scripts/release-notes.mjs; release-notes.yml rewrites it for a release made before).
    - name: Write the release notes
      id: notes
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        VERSION: ${{ needs.build-backend.outputs.version }}
      run: |
        release_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        # The newest release tag before this one (all the tags read, so sort never sees a closed pipe).
        previous=$( (git tag --list 'v*' | grep -E "$release_tag" || true) | sort -V \
          | awk -v tag="$TAG" '$0 == tag { found = before } { before = $0 } END { print found }')
        # The first release, or a pre-release, lists no pull requests: GitHub would pick where to
        # start counting from itself.
        : > prs.md
        if [ -n "$previous" ] && ! gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f previous_tag_name="$previous" --jq .body > prs.md; then
          echo "::warning::GitHub didn't list the pull requests in $TAG: the notes have the changelog's entries only."
          : > prs.md
        fi
        node scripts/release-notes.mjs block "$VERSION" CHANGELOG.md prs.md > notes.md
        delimiter="NOTES_$(openssl rand -hex 16)"
        { echo "block<<$delimiter"; cat notes.md; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

    - name: Create deployment manifest
      id: manifest
      env:
        VERSION: ${{ needs.build-backend.outputs.version }}
      run: |
        if ! [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
          echo "::error::'$VERSION' is not an image tag the build jobs pushed"
          exit 1
        fi
        prefix="$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}"
        file="docker-compose.portainer-$VERSION.yml"
        {
          echo "# Nuggets $VERSION: in this copy the backend, frontend and postgres images are $prefix/nuggets-*"
          echo "# and default to $VERSION, not latest as the notes below say. Set NUGGETS_IMAGE_TAG to run another tag."
          # The ${NUGGETS_IMAGE_TAG:-...} written into the manifest is compose's, not the shell's.
          # shellcheck disable=SC2016
          sed -E 's#^( *image: )ghcr\.io/[^/]+/(nuggets-(backend|frontend|postgres)):\$\{NUGGETS_IMAGE_TAG:-latest\}$#\1'"$prefix"'/\2:${NUGGETS_IMAGE_TAG:-'"$VERSION"'}#' \
            docker-compose.portainer.yml
        } > "$file"
        # Each image this workflow builds must now be this release's, from the registry it
        # was pushed to; a manifest that still runs latest would not pin anything.
        for name in backend frontend postgres; do
          if [ "$(grep -cF "image: $prefix/nuggets-$name:\${NUGGETS_IMAGE_TAG:-$VERSION}" "$file" || true)" != 1 ]; then
            echo "::error file=docker-compose.portainer.yml::expected one image ghcr.io/<owner>/nuggets-$name:\${NUGGETS_IMAGE_TAG:-latest}; the manifest does not run $prefix/nuggets-$name:$VERSION"
            exit 1
          fi
        done
        if grep -qF 'NUGGETS_IMAGE_TAG:-latest}' "$file"; then
          echo "::error file=docker-compose.portainer.yml::an image still defaults to latest"
          exit 1
        fi
        echo "file=$file" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: ${{ steps.manifest.outputs.file }}
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref_name, '-') }}
        body: |
          ## Nuggets ${{ needs.build-backend.outputs.version }}

          ${{ steps.notes.outputs.block }}

          Every release: [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

          ### Container images (linux/amd64, linux/arm64)
          - `${{ steps.manifest.outputs.prefix }}/nuggets-backend:${{ needs.build-backend.outputs.version }}` (`${{ needs.build-backend.outputs.digest }}`)
          - `${{ steps.manifest.outputs.prefix }}/nuggets-frontend:${{ needs.build-backend.outputs.version }}` (`${{ needs.build-frontend.outputs.digest }}`)
          - `${{ steps.manifest.outputs.prefix }}/nuggets-postgres:${{ needs.build-backend.outputs.version }}` (`${{ needs.build-postgres.outputs.digest }}`)

          ### Deploy
          `${{ steps.manifest.outputs.file }}` (below) is the repository's `docker-compose.portainer.yml` with these images as the default, so "Re-pull image and redeploy" stays on this release. A stack pasted from the repository's file runs it with `NUGGETS_IMAGE_TAG=${{ needs.build-backend.outputs.version }}`, once its image lines name `${{ steps.manifest.outputs.prefix }}`.
