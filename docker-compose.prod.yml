secrets:
  # Data-at-rest key (backups, SimpleFin URL, OneDrive tokens).
  data_encryption_key:
    file: ${SECRETS_BASE_PATH}/data_encryption_key.txt
  db_password:
    file: ${SECRETS_BASE_PATH}/db_password.txt
  # Serving role (nuggets_app) password — the unprivileged, RLS-enforced DB role the app
  # connects as. Provision it before deploying, with a non-empty value such as
  # `openssl rand -base64 32` makes; migrate.ts syncs the role's LOGIN+password from it.
  app_db_password:
    file: ${SECRETS_BASE_PATH}/app_db_password.txt
  jwt_secret:
    file: ${SECRETS_BASE_PATH}/jwt_secret.txt
  session_secret:
    file: ${SECRETS_BASE_PATH}/session_secret.txt
  csrf_secret:
    file: ${SECRETS_BASE_PATH}/csrf_secret.txt

services:
  postgres:
    # Built here from Dockerfile.postgres, like the backend and frontend, so building from
    # source needs no registry access: postgres:18-alpine with the baseline schema
    # (backend/init.sql) baked in, so no init.sql bind mount is needed.
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: nuggets_postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

    # USER SECURITY: Run as nuggets_postgres user
    user: "${POSTGRES_USER_ID:-1999}:${POSTGRES_USER_ID:-1999}"

    # FILESYSTEM SECURITY: PostgreSQL needs write access to data
    read_only: false

    # TEMPORARY FILESYSTEMS: Memory-based temp directories
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/run/postgresql:noexec,nosuid,size=100m

    # PROCESS SECURITY: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true

    # CAPABILITY RESTRICTIONS: Minimal required capabilities
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuggets_db}
      POSTGRES_USER: ${POSTGRES_USER:-nuggetsApp_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # Every container runs UTC (initdb takes the cluster's default zone from TZ). The
      # household's time zone, which decides what "today" is, is the application_timezone
      # setting in General Settings, not TZ.
      TZ: UTC

    # Server settings, as in docker-compose.portainer.yml: memory for a small host
    # (POSTGRES_MEM_LIMIT there; keep shared_buffers near a quarter of the memory), slow
    # statements logged without their parameters, lock waits logged, pg_stat_statements
    # collecting, and a server-wide end to a transaction left idle (the backend sets 5 min).
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION:-500ms}
      - -c
      - log_parameter_max_length=0
      - -c
      - log_lock_waits=on
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d %a: "
      - -c
      - idle_in_transaction_session_timeout=10min
      - -c
      - timezone=UTC

    # Docker's default 64MB /dev/shm is too small for parallel queries' shared memory.
    shm_size: 256mb

    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker: mount the parent.
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql
      - ${BACKUPS_PATH}:/backups
      # No init.sql mount — schema is baked into the postgres image (Dockerfile.postgres).

    secrets:
      - db_password

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nuggetsApp_user} -d ${POSTGRES_DB:-nuggets_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Internal-only: the DB must not be reachable from the shared reverse-proxy
    # (`frontend`) network. The backend reaches it over `nuggets_internal`.
    networks:
      - nuggets_internal

  backend:
    build:
      # Context is repo root so the sibling ./mcp package can be built alongside.
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: nuggets_backend
    restart: unless-stopped
    # Time to let a running backup or restore finish, or stop it cleanly, before Docker
    # kills the container (Docker's default is 10 s; the backend waits up to 55 s).
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

    # USER SECURITY: Run as nuggets user
    user: "${NUGGETS_USER_ID:-1001}:${NUGGETS_USER_ID:-1001}"

    # FILESYSTEM SECURITY: Backend needs write access for uploads
    read_only: false

    # TEMPORARY FILESYSTEMS: Memory-based temp directories
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
      - /var/tmp:noexec,nosuid,size=200m

    # PROCESS SECURITY: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true

    # CAPABILITY RESTRICTIONS: Minimal required capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE

    # Every backend setting (backend/src/config.ts), taken from deploy/production.env (or
    # the shell's environment) with its default: the same block as docker-compose.portainer.yml
    # (config.test.ts fails when a setting is missing from either). A container gets only the
    # variables named here.
    environment:
      # ---- Server ----
      NODE_ENV: production
      PORT: ${BACKENDPORT:-5000}
      DOMAIN_URL: ${DOMAIN_URL}
      CLIENT_URL: ${CLIENT_URL:-${DOMAIN_URL}}
      # Proxies in front of the backend: true (1, Caddy), 2 behind a CDN too, or their CIDRs.
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      # Production cookies are always Secure: "false" is ignored, with a warning.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      HSTS_PRELOAD: ${HSTS_PRELOAD:-false}
      # Leave false: the test-data generator's "delete" wipes the whole active ledger.
      ENABLE_TEST_DATA: ${ENABLE_TEST_DATA:-false}
      USE_DOCKER_SECRETS: "true"
      # Auto-apply pending DB migrations on container start (set to "false" to
      # boot without migrating — e.g. as a recovery kill switch).
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      TZ: UTC
      # ---- Passwords and sessions ----
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-12}
      REQUIRE_PASSWORD_COMPLEXITY: ${REQUIRE_PASSWORD_COMPLEXITY:-false}
      PASSWORD_BREACH_CHECK: ${PASSWORD_BREACH_CHECK:-false}
      # Sign-in sessions end after this many hours unused, and this many days after
      # sign-in however often they are used.
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-72}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-30}
      # ---- Passkeys ----
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Nuggets}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}  # default: the host of DOMAIN_URL
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}  # default: the origin of DOMAIN_URL
      # required: a passkey must check a PIN or biometric; preferred also takes keys without one.
      WEBAUTHN_USER_VERIFICATION: ${WEBAUTHN_USER_VERIFICATION:-required}
      # ---- Rate limits ----
      API_RATE_LIMITING: ${API_RATE_LIMITING:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-300000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-500}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-900000}
      RATE_LIMIT_PASSKEY_OPTIONS_MAX: ${RATE_LIMIT_PASSKEY_OPTIONS_MAX:-30}
      # ---- Database ----
      # The stack's postgres service; another server's for an external PostgreSQL 18.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-}  # default: POSTGRES_DB
      # The database the postgres service creates, and the one the backend uses unless DB_NAME says.
      POSTGRES_DB: ${POSTGRES_DB:-nuggets_db}
      # Serving role: the unprivileged, RLS-enforced `nuggets_app` role. Its password is
      # the app_db_password secret.
      DB_USER: ${DB_USER:-nuggets_app}
      # Migrations (DDL) and backups (whole-DB pg_dump/restore) run as the schema OWNER,
      # which bypasses RLS; password falls back to the db_password secret. Defaults to the
      # bootstrap owner; set explicitly if you customized POSTGRES_USER.
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-nuggetsApp_user}
      BACKUP_DB_USER: ${BACKUP_DB_USER:-}  # default: MIGRATION_DB_USER
      DB_MAINTENANCE_NAME: ${DB_MAINTENANCE_NAME:-postgres}
      # Leave unset. "true" starts the backend even as a role that bypasses RLS, but only
      # while there is at most one ledger.
      ALLOW_RLS_BYPASS_ROLE: ${ALLOW_RLS_BYPASS_ROLE:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-15000}
      PGOPTIONS: ${PGOPTIONS:-}
      # ---- Migrations ----
      DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-30}
      MIGRATION_LOCK_TIMEOUT: ${MIGRATION_LOCK_TIMEOUT:-5s}
      MIGRATION_LOCK_RETRIES: ${MIGRATION_LOCK_RETRIES:-4}
      MIGRATION_LOCK_WAIT_SECONDS: ${MIGRATION_LOCK_WAIT_SECONDS:-600}
      # ---- Files and backups ----
      BACKUP_MAX_FILE_SIZE_MB: ${BACKUP_MAX_FILE_SIZE_MB:-4096}
      # ---- Integrations ----
      SIMPLEFIN_ALLOWED_HOSTS: ${SIMPLEFIN_ALLOWED_HOSTS:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}  # default: the origin of an https CLIENT_URL
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
      ONEDRIVE_CLIENT_SECRET: ${ONEDRIVE_CLIENT_SECRET:-}
      ONEDRIVE_REDIRECT_URI: ${ONEDRIVE_REDIRECT_URI:-}
      # ---- Data retention (days) ----
      RETENTION_SESSION_DAYS: ${RETENTION_SESSION_DAYS:-30}
      RETENTION_NOTIFICATION_DAYS: ${RETENTION_NOTIFICATION_DAYS:-90}
      RETENTION_NOTIFICATION_DELIVERY_DAYS: ${RETENTION_NOTIFICATION_DELIVERY_DAYS:-365}
      RETENTION_SYNC_LOG_DAYS: ${RETENTION_SYNC_LOG_DAYS:-180}
      # ---- Shutdown (below stop_grace_period, 60s) ----
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-55000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-2000}
      # ---- Logging ----
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - ${UPLOADS_PATH}:/app/uploads:rw
      - ${BACKUPS_PATH}:/app/backups:rw
      - ${TEMP_PATH}:/app/temp:rw
      - ${LOGS_PATH}:/app/logs:rw

    secrets:
      - data_encryption_key
      - db_password
      - app_db_password
      - jwt_secret
      - session_secret
      - csrf_secret

    # Readiness, not liveness: healthy only while the backend can serve (its database
    # answers, its migrations are applied, its schedulers started, it isn't shutting
    # down), which is what the frontend's depends_on waits for. The start period covers
    # the entrypoint's wait for the database (up to 90 s).
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS -o /dev/null http://localhost:$$PORT/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    # `frontend` is also the way out, for SimpleFin, security prices, SMTP, Web Push and
    # OneDrive: `nuggets_internal` has no route off the host.
    networks:
      - frontend
      - nuggets_internal

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      # Context is repo root so the sibling ./shared package can be built alongside.
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: nuggets_frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

    # USER SECURITY: Run as nuggets user
    user: "${NUGGETS_USER_ID:-1001}:${NUGGETS_USER_ID:-1001}"

    # FILESYSTEM SECURITY: Frontend serves static files only
    read_only: true

    # TEMPORARY FILESYSTEMS: Simple temp space for static server
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

    # PROCESS SECURITY: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true

    # CAPABILITY RESTRICTIONS: No special capabilities needed
    cap_drop:
      - ALL

    environment:
      NODE_ENV: production
      # No REACT_APP variables needed - uses runtime domain detection
      # 3000 by default, as in the Portainer stack: the reverse proxy examples point at it.
      PORT: ${FRONTENDPORT:-3000}
      TZ: UTC

    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:$$PORT/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - frontend

    depends_on:
      backend:
        condition: service_healthy

networks:
  frontend:
    external: true
    name: frontend
  # App ↔ database. Internal: no route off the host, so Postgres, on this network alone,
  # can neither reach out nor be reached from outside.
  nuggets_internal:
    name: nuggets_internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
